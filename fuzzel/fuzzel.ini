# fuzzel — лончер, matrix-зелёная тема
[main]
font=JetBrainsMono Nerd Font:size=12
prompt=">>> "

# MRU: сортировать список по счётчику запусков (кэш ~/.cache/fuzzel) —
# часто/недавно вызванные всплывают наверх. Дефолт fuzzel и так yes; фиксируем явно.
sort-result=yes
icon-theme=Yaru
icons-enabled=yes
terminal=foot -e
layer=overlay
# width здесь — для ЛОНЧЕРА SUPER+D (имена приложений). Фикс-меню (сервисы/питание) шлют
# свой --width под их контент. h-pad мал → рамка ближе к тексту (меньше «фантомных» боков).
width=34
lines=12
horizontal-pad=8
vertical-pad=12
inner-pad=8
# Закрытие по потере фокуса (клик по другому окну): on-demand-фокус + дефолтный
# exit-on-keyboard-focus-loss. Проверено: Hyprland сразу фокусит слой (печать работает
# СРАЗУ), а клик по другому окну → потеря фокуса → fuzzel закрывается. Так ведёт себя как
# нормальное меню. (exclusive — грабит клаву, не закрывается по клику-мимо.)
keyboard-focus=on-demand

[colors]
background=000802f2
text=00cc33ff
match=00ff41ff
selection=00ff4133
selection-text=00ff41ff
selection-match=00ff41ff
border=00ff41ff
prompt=00ff41ff

[border]
width=2
radius=6
