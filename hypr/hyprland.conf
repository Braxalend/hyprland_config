# ============================================================================
#  Hyprland — рабочий конфиг ноутбука. Matrix-зелёная тема #00ff41.
#  Ставился рядом с GNOME (GNOME остаётся fallback в GDM). Сессия в GDM:
#  "Hyprland (uwsm-managed)". Управляется uwsm → поднимает graphical-session
#  target, поэтому пользовательские systemd-юниты стартуют
#  сами. Правки применяются на лету: SUPER+SHIFT+R (reload).
# ============================================================================

### МОНИТОРЫ ###############################################################
# Точное имя выхода узнать в сессии: hyprctl monitors
# Физический порядок слева-направо: DP-2 (XMI, ЛЕВЫЙ) → eDP-1 (ноут) → HDMI-A-1 (HP, ПРАВЫЙ).
# Явные строки задают позиции по X встык (каждый 1920 шириной), верх выровнен (y=0).
# Wildcard-строка ниже — fallback для незнакомых/новых выходов (докстанция и т.п.).
monitor = DP-2,1920x1080@64.95,0x0,1
monitor = eDP-1,1920x1200@60,1920x0,1
monitor = HDMI-A-1,1920x1080@60,3840x0,1
monitor = , preferred, auto, 1

# Нумерация воркспейсов по физическому порядку слева-направо:
# №1 — левый внешний (DP-2), №2 — ноут (eDP-1), №3 — правый внешний (HDMI-A-1).
workspace = 1, monitor:DP-2, default:true
workspace = 2, monitor:eDP-1, default:true
workspace = 3, monitor:HDMI-A-1, default:true

### ПЕРЕМЕННЫЕ ОКРУЖЕНИЯ ###################################################
env = XCURSOR_THEME,Yaru
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Yaru
env = HYPRCURSOR_SIZE,24
# Electron/Chromium (Tabby, Chrome) — нативный Wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = MOZ_ENABLE_WAYLAND,1
# Qt приложения — Wayland + без своих декораций
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
# AMD Radeon 680M: аппаратный HW-курсор КРАШИТ Hyprland при monitor-reload
# (SIGABRT в renderHWCursorBuffer, потеря окон — инцидент 2026-07-07, safe-mode).
# Поэтому HW-курсор ВЫКЛючен (программный курсор — стабильно). Чтобы вернуть
# аппаратный — закомментировать строку ниже, но учти краш.
cursor:no_hardware_cursors = true

### АВТОЗАПУСК #############################################################
# GUI-процессы Hyprland-окружения — через `uwsm app` (правильные systemd-scope).
# systemd user-юниты (треи, демоны ввода и т.п.) НЕ здесь —
# они стартуют сами через graphical-session.target/default.target под uwsm.
exec-once = uwsm app -- /usr/libexec/hyprpolkitagent
# Обои: живой GLSL-дым (glpaper) с автозапуска (замена статичного hyprpaper).
# shader-wall сам гасит hyprpaper и при падении glpaper возвращает статичные обои
# (фейл-сейф). НАМЕРЕННО без `uwsm app --`: транзиентный scope, завершаясь после
# выхода скрипта, убил бы отсоединённый setsid'ом glpaper. SUPER+SHIFT+B — toggle.
exec-once = ~/.local/bin/shader-wall
# Живые обои на выходах, подключаемых после входа (докстанция): hotplug-листенер socket2
exec-once = uwsm app -- ~/.local/bin/shader-wall-hotplug
# Панель: waybar под супервизором (рестарт при тихом выходе + лог ~/.local/state/waybar.log).
# Было: uwsm app -- waybar — waybar периодически умирал без следов.
exec-once = uwsm app -- ~/.local/bin/waybar-supervised
exec-once = uwsm app -- mako
exec-once = uwsm app -- hypridle
# История буфера обмена (cliphist): без менеджера буфер умирал вместе с окном-источником
# и не переживал затирание извне. SUPER+V — выбор из истории (см. раздел биндов).
exec-once = uwsm app -- wl-paste --type text --watch cliphist store
exec-once = uwsm app -- wl-paste --type image --watch cliphist store
# Импорт курсора в тему
exec-once = hyprctl setcursor Yaru 24

### ВВОД ##################################################################
input {
    kb_layout = us,ru
    kb_variant =
    kb_options =
    # ^ Alt+Shift убран: он покомандный (per-device) и рассинхронивал раскладки
    #   между клавиатурами. Единственный механизм — SUPER+SPACE (hypr-kbtoggle,
    #   switchxkblayout all — синхронно для всех клав, вкл. виртуальные).
    follow_mouse = 0
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = false   # тачпад НЕ глохнет во время набора (DWT off)
    }
}

gesture = 3, horizontal, workspace

### ВНЕШНИЙ ВИД (matrix) ##################################################
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(00ff41ee) rgba(00cc33ee) 45deg
    col.inactive_border = rgba(0a2a12aa)
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 6
    active_opacity = 1.0
    inactive_opacity = 0.96
    blur {
        enabled = false  # off: GL-crash render path on Radeon 680M, 2026-07-07
        size = 4
        passes = 2
        vibrancy = 0.15
    }
    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00ff4133)
    }
}

animations {
    enabled = true
    bezier = matrix, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, matrix
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 8, default
    animation = fade, 1, 6, default
    animation = workspaces, 1, 5, matrix, slide
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

### ПРАВИЛА ОКОН ##########################################################
# Синтаксис 0.55.4 (git-парсер): matcher = match:class|match:title, правило со значением
windowrule = match:class ^(pavucontrol|nm-connection-editor|blueman-manager)$, float true
windowrule = match:class ^(org.gnome.Calculator)$, float true
windowrule = match:title ^(Открыть файл|Save File|Открыть)$, float true
# Диалог zenity (sudo-askpass) — плавающий, поверх, по центру
windowrule = match:class ^(zenity)$, float true
windowrule = match:class ^(zenity)$, pin true
windowrule = match:class ^(zenity)$, center true
# Пример: чат-окна браузера — сразу на рабочий стол 9, фокус не трогать
windowrule = match:title ^(DeepSeek), workspace 9 silent

### ГОРЯЧИЕ КЛАВИШИ #######################################################
$mod = SUPER
$term = foot
$term2 = gnome-terminal
$menu = fuzzel

# Приложения
bind = $mod, RETURN, exec, uwsm app -- $term
bind = $mod, code:28, exec, uwsm app -- $term            # code:28 = физ. T (термин.), работает при любой раскладке
bind = $mod SHIFT, RETURN, exec, uwsm app -- $term2
bind = $mod SHIFT, code:28, exec, uwsm app -- $term2     # SHIFT+T = второй терминал
bind = $mod, code:40, exec, ~/.local/bin/rofi-launch   # code:40 = физ. D — rofi drun (toggle, single-instance)
bind = $mod SHIFT, code:40, exec, uwsm app -- $menu      # SHIFT+D = fuzzel drun
bind = $mod, code:26, exec, uwsm app -- nautilus         # code:26 = физ. E — файлы

# Управление окнами
# ВСЕ бинды по буквам переведены на КЕЙКОДЫ (code:NN) — иначе при русской раскладке
# keysym меняется и хоткей молча не срабатывает.
# code:24 = физ. Q — закрыть окно (killactive), работает при любой раскладке.
bind = $mod, code:24, killactive,
bind = $mod, code:41, fullscreen, 0                      # code:41 = физ. F — полный экран
bind = $mod SHIFT, SPACE, togglefloating,
bind = $mod, code:33, pseudo,                            # code:33 = физ. P — псевдотайл
bind = $mod, code:44, layoutmsg, togglesplit             # code:44 = физ. J — сменить ось сплита
# История буфера (cliphist): выбор пункта → в буфер (дальше Ctrl+V как обычно).
bind = $mod, code:47, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy  # code:47 = физ. V
# Свернуть окно (minimize) — уходит в спец-воркспейс "minimized", фокус НЕ прыгает.
# Восстановить: клик по иконке в waybar-таскбаре (wlr/taskbar) ИЛИ SUPER+S (меню возврата, unminimize.sh).
# По КЕЙКОДУ (code:58=физ. M) — работает при любой раскладке.
bind = $mod, code:58, movetoworkspacesilent, special:minimized
# По КЕЙКОДУ (code:39=физ. S) — меню fuzzel: выбрать свёрнутое окно и вернуть.
bind = $mod, code:39, exec, ~/.local/bin/unminimize.sh
bind = $mod SHIFT, code:27, exec, hyprctl reload         # code:27 = физ. R — перечитать конфиг
# Выход из сессии (uwsm корректно гасит graphical-session). code:58 = физ. M.
bind = $mod SHIFT, code:58, exec, uwsm stop

# Фокус (стрелки и vim-hjkl). hjkl переведены на КЕЙКОДЫ.
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod, code:43, movefocus, l                       # code:43 = физ. H — фокус влево
bind = $mod, code:45, movefocus, u                       # code:45 = физ. K — фокус вверх
# j (физ. code:44) и l (физ. code:46) НЕ биндим на movefocus: эти клавиши уже заняты
# уникальными действиями (J=togglesplit выше, L=hyprlock ниже) — в кейкодах это был бы
# дубль на одном code+modmask. Фокус вправо/вниз остаётся на SUPER+стрелках (см. выше).
# bind = $mod, code:46, movefocus, r   # конфликтует с SUPER+L=hyprlock
# bind = $mod, code:44, movefocus, d   # конфликтует с SUPER+J=togglesplit

# Перемещение окон
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# Рабочие столы 1..10
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
# Прокрутка столов колесом на модификаторе
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Мышь: тащить/ресайзить окна
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Раскладка: SUPER+SPACE = глобально-синхронный toggle (все клавиатуры, вкл. виртуальные).
# Alt+Shift (grp:) УБРАН из kb_options — SUPER+SPACE единственный (синхронный).
bind = $mod, SPACE, exec, ~/.local/bin/hypr-kbtoggle

# Скриншоты — В БУФЕР себе (+ копия в ~/Pictures/Screenshots/). НИКУДА не отправляются.
# Print = область; SHIFT+Print = весь экран. tee: файл + буфер за один снимок.
bind = , Print, exec, grim -g "$(slurp)" - | tee ~/Pictures/Screenshots/scr-$(date +%Y%m%d-%H%M%S).png | wl-copy
bind = SHIFT, Print, exec, grim - | tee ~/Pictures/Screenshots/scr-$(date +%Y%m%d-%H%M%S).png | wl-copy

# Блокировка. code:46 = физ. L — работает при любой раскладке.
bind = $mod, code:46, exec, uwsm app -- hyprlock

# Шпаргалка хоткеев
bind = $mod, slash, exec, uwsm app -- ~/.local/bin/hypr-cheatsheet

# Живые GLSL-обои (glpaper) — toggle, НЕ автозапуск (GPU-риск)
bind = $mod SHIFT, code:56, exec, ~/.local/bin/shader-wall   # code:56 = физ. B

# Громкость / яркость / медиа
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous
