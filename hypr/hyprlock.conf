# Экран блокировки — matrix-зелёный на чёрном
background {
    monitor =
    color = rgba(0, 8, 2, 1.0)
    path = ~/.config/hypr/matrix-wall.png
    blur_passes = 2
    blur_size = 4
}

general {
    hide_cursor = true
    grace = 2
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.32
    outer_color = rgba(00ff41ff)
    inner_color = rgba(0, 12, 4, 0.85)
    font_color = rgba(00ff41ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##00ff41">Пароль…</span>
    check_color = rgba(00cc33ff)
    fail_color = rgba(ff2200ff)
    fail_text = <span foreground="##ff2200">Неверно ($ATTEMPTS)</span>
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M:%S')"
    color = rgba(00ff41ff)
    font_size = 64
    font_family = monospace
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:18000] echo "$(date +'%A, %d %B')"
    color = rgba(00cc33ff)
    font_size = 20
    font_family = monospace
    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER@$(hostname)
    color = rgba(00ff4188)
    font_size = 14
    font_family = monospace
    position = 0, -120
    halign = center
    valign = center
}
